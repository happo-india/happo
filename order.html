<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Order</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* MAIN CARD */
.form-container {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
}

/* PRODUCT PREVIEW */
.product-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: linear-gradient(135deg, #f8f9ff, #f1f2ff);
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 14px;
}

.product-box p {
    margin: 0;
}

.product-box span {
    font-weight: 600;
}

/* FORM */
.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: #333;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: border 0.3s, box-shadow 0.3s;
}

input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
}

/* BUTTON */
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102,126,234,0.45);
}

/* SMALL NOTE */
.note {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="form-container">
    <h2>Confirm Your Order</h2>

    <!-- Product Preview -->
    <div class="product-box">
        <p>🛍 <b>Product:</b> <span id="pname"></span></p>
        <p>💰 <b>Price:</b> ₹<span id="pprice"></span></p>
        <p>📏 <b>Size:</b> <span id="psize"></span></p>
    </div>

    <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="361bd8ca-cbe7-44ec-b942-97011904f08f">

        <!-- Hidden product fields -->
        <input type="hidden" name="product_id" id="product_id">
        <input type="hidden" name="product_name" id="product_name">
        <input type="hidden" name="product_price" id="product_price">
        <input type="hidden" name="size" id="product_size">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="number" placeholder="10-digit mobile number" required>
        </div>

        <button type="submit">Place Order</button>

        <p class="note">🔒 Your details are safe & secure</p>
    </form>
</div>

<script>
const product = JSON.parse(localStorage.getItem("selectedProduct"));

if (product) {
    document.getElementById("pname").innerText = product.name;
    document.getElementById("pprice").innerText = product.price;
    document.getElementById("psize").innerText = product.selectedSize || "N/A";

    document.getElementById("product_id").value = product.id;
    document.getElementById("product_name").value = product.name;
    document.getElementById("product_price").value = product.price;
    document.getElementById("product_size").value = product.selectedSize || "";
}
</script>

</body>
</html>
