<!-- ...HTML and CSS... -->

<div class="container">
    <!-- IMAGE SLIDER -->
    <div class="product-img">
        <div class="slides" id="slides"></div>
        <button class="arrow left" onclick="prevSlide()">❮</button>
        <button class="arrow right" onclick="nextSlide()">❯</button>
    </div>

    <!-- DETAILS -->
    <div class="details">
        <h1 id="name"></h1>
        <p class="price">₹<span id="price"></span></p>
        <p class="desc" id="desc"></p>
        <p><b>Select Size</b></p>
        <div class="size-options" id="sizeOptions"></div>
        <button class="buy-btn" onclick="buyNow()">Buy Now</button>
    </div>
</div>

<script>
/* GET PRODUCT DATA */
const product = JSON.parse(localStorage.getItem("selectedProduct"));
let selectedSize = null;
let currentIndex = 0;

if (!product) {
    window.location.href = "index.html";
}

/* POPULATE DETAILS */
document.getElementById("name").innerText = product.name;
document.getElementById("price").innerText = product.price;
document.getElementById("desc").innerText = product.desc;

/* IMAGE SLIDER */
const slides = document.getElementById("slides");
product.images.forEach(img => {
    const image = document.createElement("img");
    image.src = img;
    slides.appendChild(image);
});

function updateSlidePosition() {
    slides.style.transform = `translateX(-${currentIndex * 100}%)`;
}

function nextSlide() {
    currentIndex = (currentIndex + 1) % product.images.length;
    updateSlidePosition();
}

function prevSlide() {
    currentIndex = (currentIndex - 1 + product.images.length) % product.images.length;
    updateSlidePosition();
}

// Initialize slider
updateSlidePosition();

/* SIZE BUTTONS */
const sizeBox = document.getElementById("sizeOptions");
product.sizes.forEach(size => {
    const btn = document.createElement("button");
    btn.className = "size-btn";
    btn.innerText = size;
    btn.onclick = () => {
        document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedSize = size;
    };
    sizeBox.appendChild(btn);
});

/* BUY BUTTON */
function buyNow() {
    if (!selectedSize) {
        alert("Please select a size");
        return;
    }
    product.selectedSize = selectedSize;
    localStorage.setItem("selectedProduct", JSON.stringify(product));
    window.location.href = "order.html";
}
</script>
</body>
</html>
